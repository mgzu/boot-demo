spring:
  profiles:
    include: common

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:boot_demo_db
    username: postgres
    password: 123456
  sql:
    init:
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

framework:
  tenant:
    enable: true
